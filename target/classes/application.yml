server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/loan-db
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    root: INFO
    com.example.loan: INFO

# Overrideable properties
integration:
  loan:
    base-url: https://demo9993930.mockable.io